# XcodeGen project spec for the OpenClaw Voice app.
# Generate the Xcode project with:  xcodegen generate  (from this directory)
name: OpenClawVoice
options:
  bundleIdPrefix: dev.openclaw
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    visionOS: "1.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: true
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "OpenClaw Voice listens to you to hold a voice conversation with your agent."
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Your speech is transcribed on-device before being sent to your agent."

targetTemplates:
  VoiceApp:
    type: application
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: OpenClawVoice
        ENABLE_USER_SCRIPT_SANDBOXING: true
    info:
      path: Generated/Info-${target_name}.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "OpenClaw Voice listens to you to hold a voice conversation with your agent."
        NSSpeechRecognitionUsageDescription: "Your speech is transcribed on-device before being sent to your agent."
        # The phone-agent bridge usually runs on the LAN over ws:// (no TLS).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio

targets:
  OpenClawVoice-iOS:
    templates: [VoiceApp]
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openclaw.voice.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  OpenClawVoice-visionOS:
    templates: [VoiceApp]
    platform: visionOS
    deploymentTarget: "1.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openclaw.voice.visionos
