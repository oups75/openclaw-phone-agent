[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-phone-agent"
version = "0.1.0"
description = "Local-first ARI bridge skeleton for Asterisk and future OpenClaw integration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "websockets>=12,<16",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0"
]

[project.optional-dependencies]
dev = []

[tool.setuptools]
packages = ["app"]
